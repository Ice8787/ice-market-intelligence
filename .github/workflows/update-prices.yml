name: Update price reactions
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enrich historical price windows
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
        run: python scripts/enrich_existing.py
      - run: python scripts/validate.py
      - name: Commit changed prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: update price reactions"
          git push
