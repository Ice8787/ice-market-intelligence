name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # Runs five minutes after the market-data workflow, so bot commits are
    # published even though pushes made with GITHUB_TOKEN do not start a new workflow.
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
